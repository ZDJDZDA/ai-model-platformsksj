<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 模型管理平台 - Firebase版</title>

    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg: #0f1117;
            --card: #1a1d27;
            --card-hover: #222636;
            --border: #2d3142;
            --text: #e4e6ed;
            --text-secondary: #9ca3af;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            --transition: 0.2s ease;
            --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(ellipse at 20% 50%, #1a1d2e 0%, #0f1117 70%);
        }
        .app-container { width: 100%; max-width: 1400px; min-height: 80vh; display: flex; flex-direction: column; gap: 20px; }
        .app-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 24px; background: var(--card); border-radius: var(--radius);
            border: 1px solid var(--border); box-shadow: var(--shadow);
            flex-wrap: wrap; gap: 12px;
        }
        .app-header .logo { font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .app-header .logo .icon { width: 36px; height: 36px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .app-header .user-info { display: flex; align-items: center; gap: 14px; font-size: 0.9rem; color: var(--text-secondary); flex-wrap: wrap; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
        .badge-admin { background: rgba(99,102,241,0.2); color: var(--accent-hover); border: 1px solid rgba(99,102,241,0.4); }
        .badge-user { background: rgba(16,185,129,0.15); color: var(--success); border: 1px solid rgba(16,185,129,0.35); }
        .btn {
            padding: 10px 20px; border-radius: var(--radius-sm); border: none; cursor: pointer;
            font-size: 0.9rem; font-weight: 600; font-family: var(--font); transition: var(--transition);
            letter-spacing: 0.3px; display: inline-flex; align-items: center; gap: 8px; user-select: none;
            text-decoration: none;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 4px 16px rgba(99,102,241,0.4); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-outline { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-outline:hover { background: var(--card-hover); color: var(--text); }
        .btn-sm { padding: 6px 14px; font-size: 0.8rem; border-radius: 6px; }
        .card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 24px; transition: var(--transition); }
        .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px 16px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: #11141d; color: var(--text);
            font-size: 0.95rem; font-family: var(--font); transition: var(--transition); outline: none;
            resize: vertical;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
        }
        .auth-container { max-width: 420px; margin: 0 auto; width: 100%; }
        .auth-tabs { display: flex; gap: 0; margin-bottom: 20px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); }
        .auth-tabs button { flex: 1; padding: 12px; background: transparent; border: none; color: var(--text-secondary); font-size: 0.9rem; font-weight: 600; cursor: pointer; font-family: var(--font); transition: var(--transition); }
        .auth-tabs button.active { background: var(--accent); color: #fff; }
        .auth-tabs button:not(.active):hover { background: var(--card-hover); }
        .auth-message { padding: 12px 16px; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 14px; display: none; font-weight: 500; }
        .auth-message.error { display: block; background: rgba(239,68,68,0.12); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
        .auth-message.success { display: block; background: rgba(16,185,129,0.12); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
        .model-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .model-card { padding: 16px; border-radius: var(--radius-sm); border: 2px solid var(--border); background: #11141d; cursor: pointer; transition: var(--transition); text-align: center; position: relative; user-select: none; }
        .model-card:hover { border-color: #4a5068; background: #161a26; }
        .model-card.selected { border-color: var(--accent); background: rgba(99,102,241,0.1); box-shadow: 0 0 20px rgba(99,102,241,0.2); }
        .model-card .model-name { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; }
        .model-card .model-provider { font-size: 0.7rem; color: var(--text-secondary); }
        .model-card .check-mark { position: absolute; top: 8px; right: 10px; color: var(--accent); font-size: 1.1rem; display: none; }
        .model-card.selected .check-mark { display: block; }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-secondary); font-weight: 700; background: #11141d; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
        .status-dot.approved { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .status-dot.pending { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
        .password-cell { display: flex; align-items: center; gap: 6px; font-family: 'Courier New', monospace; }
        .password-cell .pw-text { filter: blur(4px); transition: var(--transition); cursor: pointer; user-select: all; }
        .password-cell .pw-text:hover, .password-cell .pw-text.revealed { filter: none; }
        .main-content { display: flex; flex-direction: column; gap: 20px; }
        .section-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .section-grid { grid-template-columns: 1fr; } }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 28px; max-width: 500px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.5); animation: modalIn 0.25s ease; }
        @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .modal h3 { font-size: 1.2rem; margin-bottom: 16px; font-weight: 700; }
        .modal .close-btn { float: right; background: none; border: none; color: var(--text-secondary); font-size: 1.4rem; cursor: pointer; font-family: var(--font); line-height: 1; }
        .modal .close-btn:hover { color: var(--text); }
        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 14px 20px; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 600; animation: toastIn 0.3s ease; box-shadow: 0 8px 32px rgba(0,0,0,0.4); max-width: 360px; }
        .toast.success { background: var(--success); color: #fff; }
        .toast.error { background: var(--danger); color: #fff; }
        .toast.info { background: var(--accent); color: #fff; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        .toast.out { animation: toastOut 0.3s ease forwards; }
        @keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }
        .hidden { display: none !important; }
        .text-muted { color: var(--text-secondary); font-size: 0.8rem; }
        .mt-12 { margin-top: 12px; }
        .mb-12 { margin-bottom: 12px; }
        .flex-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        .loading { text-align: center; padding: 20px; color: var(--text-secondary); }

        /* 对话界面 */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 500px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: #11141d;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chat-message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .chat-message.user {
            align-self: flex-end;
            background: var(--accent);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .chat-message.ai {
            align-self: flex-start;
            background: var(--card-hover);
            color: var(--text);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }
        .chat-message.system {
            align-self: center;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.75rem;
            padding: 4px 12px;
        }
        .chat-input-area {
            display: flex;
            gap: 8px;
            padding: 16px;
            border-top: 1px solid var(--border);
            background: var(--card);
        }
        .chat-input-area textarea {
            flex: 1;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: #11141d;
            color: var(--text);
            font-family: var(--font);
            font-size: 0.9rem;
            resize: none;
            height: 50px;
            outline: none;
        }
        .chat-input-area textarea:focus { border-color: var(--accent); }
        .chat-input-area button {
            height: 50px;
            padding: 0 20px;
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-family: var(--font);
            transition: var(--transition);
        }
        .chat-input-area button:hover { background: var(--accent-hover); }
        .chat-input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <!-- 登录/注册 -->
    <div id="authApp" class="auth-container hidden">
        <div class="card" style="padding: 32px;">
            <div style="text-align:center; margin-bottom:24px;">
                <div style="font-size:2.5rem; margin-bottom:8px;">🤖</div>
                <h2 style="font-weight:800; letter-spacing:-1px; font-size:1.6rem;">AI 模型管理平台</h2>
                <p class="text-muted mt-12">登录或注册以继续</p>
            </div>
            <div class="auth-tabs">
                <button id="tabLogin" class="active" onclick="switchAuthTab('login')">登录</button>
                <button id="tabRegister" onclick="switchAuthTab('register')">注册</button>
            </div>
            <div id="authMessage" class="auth-message"></div>
            <div id="loginForm">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="loginUsername" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" placeholder="请输入密码">
                </div>
                <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="handleLogin()">登 录</button>
            </div>
            <div id="registerForm" class="hidden">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="regUsername" placeholder="设置用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="regPassword" placeholder="设置密码">
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="regConfirmPassword" placeholder="再次输入密码">
                </div>
                <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="handleRegister()">注 册</button>
                <p class="text-muted mt-12" style="text-align:center;">注册后需等待管理员审核通过</p>
            </div>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="mainApp" class="app-container hidden">
        <div class="app-header">
            <div class="logo">
                <span class="icon">🤖</span>
                <span>AI 模型管理平台</span>
            </div>
            <div class="user-info">
                <span id="headerUsername"></span>
                <span id="headerBadge"></span>
                <button class="btn btn-outline btn-sm" onclick="handleLogout()">退出</button>
            </div>
        </div>

        <!-- 管理员面板 -->
        <div id="adminPanel" class="main-content hidden">
            <div class="card">
                <div class="card-title">👥 用户管理</div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr><th>用户名</th><th>密码</th><th>角色</th><th>状态</th><th>操作</th></tr>
                        </thead>
                        <tbody id="userTableBody"></tbody>
                    </table>
                </div>
                <div id="emptyUsers" class="hidden text-muted" style="text-align:center;padding:20px;">暂无用户数据</div>
            </div>
            <div class="card">
                <div class="card-title">⚙️ 全局 AI 模型配置</div>
                <div class="model-grid" id="globalModelGrid"></div>
                <div class="form-group">
                    <label>API Key</label>
                    <input type="text" id="globalApiKey" placeholder="输入全局默认 API Key">
                </div>
                <div class="form-group">
                    <label>API 端点</label>
                    <input type="text" id="globalApiEndpoint" placeholder="API 端点（留空使用模型默认）">
                </div>
                <button class="btn btn-primary" onclick="saveGlobalConfig()">保存全局配置</button>
            </div>
        </div>

        <!-- 用户面板 -->
        <div id="userPanel" class="main-content hidden">
            <div class="section-grid">
                <div class="card">
                    <div class="card-title">🔑 我的 AI 模型配置</div>
                    <div class="model-grid" id="userModelGrid"></div>
                    <div class="form-group">
                        <label>API Key</label>
                        <input type="text" id="userApiKey" placeholder="输入你的 API Key（留空使用全局配置）">
                    </div>
                    <div class="form-group">
                        <label>API 端点（可选）</label>
                        <input type="text" id="userApiEndpoint" placeholder="自定义 API 端点（留空使用模型默认）">
                    </div>
                    <div class="flex-between">
                        <button class="btn btn-primary" onclick="saveUserConfig()">保存我的配置</button>
                        <button class="btn btn-success" onclick="testApiKey()">测试连接</button>
                    </div>
                    <div id="testResult" style="padding:16px;border-radius:8px;margin-top:12px;display:none;"></div>
                </div>
                <div class="card">
                    <div class="card-title">📋 账户信息</div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;" id="accountInfo"></div>
                </div>
            </div>
            <!-- 对话界面 -->
            <div class="card">
                <div class="card-title">💬 AI 对话</div>
                <div class="chat-container">
                    <div class="chat-messages" id="chatMessages">
                        <div class="chat-message system">👋 欢迎使用 AI 对话。消息将保存在云端，可跨设备访问。</div>
                    </div>
                    <div class="chat-input-area">
                        <textarea id="chatInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
                        <button id="sendBtn" onclick="sendMessage()">发送</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== Firebase 初始化 ====================
        const firebaseConfig = {
            apiKey: "AIzaSyADQcZWoiXW7-c7Llf2mSE13SSJSmDryeQ",
            authDomain: "ai-model-platform.firebaseapp.com",
            projectId: "ai-model-platform",
            storageBucket: "ai-model-platform.firebasestorage.app",
            messagingSenderId: "1039114008055",
            appId: "1:1039114008055:web:1c89f61783edcbe7eeeaf2"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ==================== 全局状态 ====================
        let currentUser = null; // 当前登录用户对象
        const AI_MODELS = [
            { id: 'gpt-4o', name: 'GPT-4o', provider: 'OpenAI', endpoint: 'https://api.openai.com/v1/chat/completions' },
            { id: 'gpt-4o-mini', name: 'GPT-4o Mini', provider: 'OpenAI', endpoint: 'https://api.openai.com/v1/chat/completions' },
            { id: 'gpt-3.5-turbo', name: 'GPT-3.5 Turbo', provider: 'OpenAI', endpoint: 'https://api.openai.com/v1/chat/completions' },
            { id: 'claude-3-5-sonnet', name: 'Claude 3.5 Sonnet', provider: 'Anthropic', endpoint: 'https://api.anthropic.com/v1/messages' },
            { id: 'claude-3-opus', name: 'Claude 3 Opus', provider: 'Anthropic', endpoint: 'https://api.anthropic.com/v1/messages' },
            { id: 'gemini-pro', name: 'Gemini Pro', provider: 'Google', endpoint: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent' },
            { id: 'deepseek-chat', name: 'DeepSeek Chat', provider: 'DeepSeek', endpoint: 'https://api.deepseek.com/v1/chat/completions' },
            { id: 'qwen-turbo', name: '通义千问 Turbo', provider: 'Alibaba', endpoint: 'https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation' },
            { id: 'custom', name: '自定义模型', provider: 'Custom', endpoint: '' },
        ];

        // ==================== 工具函数 ====================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.add('out'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function escHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
        }

        // ==================== 认证相关 ====================
        function switchAuthTab(tab) {
            document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
            document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
            document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
            document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
            const msg = document.getElementById('authMessage');
            msg.className = 'auth-message';
            msg.style.display = 'none';
        }

        function showAuthMessage(msg, type) {
            const el = document.getElementById('authMessage');
            el.className = `auth-message ${type}`;
            el.textContent = msg;
            el.style.display = 'block';
        }

        async function handleRegister() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirmPassword').value;

            if (!username || !password) return showAuthMessage('请填写用户名和密码', 'error');
            if (username.length < 3) return showAuthMessage('用户名至少3个字符', 'error');
            if (password.length < 4) return showAuthMessage('密码至少4个字符', 'error');
            if (password !== confirm) return showAuthMessage('两次密码不一致', 'error');

            try {
                // 检查用户名是否已存在
                const userRef = db.collection('users').doc(username);
                const doc = await userRef.get();
                if (doc.exists) {
                    return showAuthMessage('用户名已存在', 'error');
                }

                // 创建用户文档（文档ID = 用户名）
                await userRef.set({
                    username: username,
                    password: password, // 注意：实际项目应哈希存储
                    role: 'user',
                    approved: false,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    config: null
                });
                showAuthMessage('注册成功！请等待管理员审核通过后登录。', 'success');
                document.getElementById('regUsername').value = '';
                document.getElementById('regPassword').value = '';
                document.getElementById('regConfirmPassword').value = '';
                setTimeout(() => switchAuthTab('login'), 1500);
            } catch (e) {
                console.error('注册失败:', e);
                showAuthMessage('注册失败: ' + e.message, 'error');
            }
        }

        async function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) return showAuthMessage('请填写用户名和密码', 'error');

            try {
                const userRef = db.collection('users').doc(username);
                const doc = await userRef.get();
                if (!doc.exists) {
                    return showAuthMessage('用户不存在', 'error');
                }
                const userData = doc.data();
                if (userData.password !== password) {
                    return showAuthMessage('密码错误', 'error');
                }
                if (!userData.approved && userData.role !== 'admin') {
                    return showAuthMessage('账户尚未通过审核', 'error');
                }

                currentUser = { id: username, ...userData };
                showToast(`欢迎，${username}！`, 'success');
                enterMainApp();
            } catch (e) {
                console.error('登录失败:', e);
                showAuthMessage('登录失败: ' + e.message, 'error');
            }
        }

        async function handleLogout() {
            currentUser = null;
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('authApp').classList.remove('hidden');
            showToast('已退出登录', 'info');
        }

        // ==================== 主界面切换 ====================
        function enterMainApp() {
            if (!currentUser) return;
            document.getElementById('authApp').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('headerUsername').textContent = currentUser.username;

            const badge = document.getElementById('headerBadge');
            if (currentUser.role === 'admin') {
                badge.className = 'badge badge-admin';
                badge.textContent = '管理员';
                document.getElementById('adminPanel').classList.remove('hidden');
                document.getElementById('userPanel').classList.add('hidden');
                renderAdminUsers();
                renderGlobalConfig();
            } else {
                badge.className = 'badge badge-user';
                badge.textContent = '已审核';
                document.getElementById('userPanel').classList.remove('hidden');
                document.getElementById('adminPanel').classList.add('hidden');
                renderUserPanel();
            }
        }

        // ==================== 模型网格渲染 ====================
        function renderModelGrid(containerId, selectedModelId, onSelect) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            AI_MODELS.forEach(model => {
                const card = document.createElement('div');
                card.className = `model-card ${model.id === selectedModelId ? 'selected' : ''}`;
                card.innerHTML = `
                    <span class="check-mark">✓</span>
                    <div class="model-name">${model.name}</div>
                    <div class="model-provider">${model.provider}</div>
                `;
                card.addEventListener('click', () => {
                    container.querySelectorAll('.model-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    onSelect(model);
                });
                container.appendChild(card);
            });
        }

        // ==================== 管理员功能 ====================
        async function renderAdminUsers() {
            const tbody = document.getElementById('userTableBody');
            const empty = document.getElementById('emptyUsers');
            tbody.innerHTML = '';
            try {
                const snapshot = await db.collection('users').get();
                const users = [];
                snapshot.forEach(doc => {
                    if (doc.data().role !== 'admin') {
                        users.push({ id: doc.id, ...doc.data() });
                    }
                });
                if (users.length === 0) {
                    empty.classList.remove('hidden');
                    return;
                }
                empty.classList.add('hidden');
                users.forEach(u => {
                    const tr = document.createElement('tr');
                    const statusDot = u.approved ? 'approved' : 'pending';
                    const statusText = u.approved ? '已审核' : '待审核';
                    tr.innerHTML = `
                        <td><strong>${escHtml(u.username)}</strong></td>
                        <td>
                            <span class="password-cell">
                                <span class="pw-text" onclick="togglePw(this)">${escHtml(u.password)}</span>
                                <button class="btn btn-outline btn-sm" onclick="togglePw(this.parentElement.querySelector('.pw-text'))">👁</button>
                            </span>
                        </td>
                        <td>用户</td>
                        <td><span class="status-dot ${statusDot}"></span>${statusText}</td>
                        <td>
                            ${!u.approved ? 
                                `<button class="btn btn-success btn-sm" onclick="approveUser('${u.id}')">✓ 通过</button> ` : 
                                `<button class="btn btn-danger btn-sm" onclick="rejectUser('${u.id}')">✗ 撤销</button>`}
                            <button class="btn btn-outline btn-sm" onclick="deleteUser('${u.id}')">删除</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error('获取用户列表失败:', e);
                showToast('获取用户列表失败', 'error');
            }
        }

        function togglePw(el) {
            el.classList.toggle('revealed');
        }

        async function approveUser(userId) {
            try {
                await db.collection('users').doc(userId).update({ approved: true });
                showToast('已通过审核', 'success');
                renderAdminUsers();
            } catch (e) {
                showToast('操作失败', 'error');
            }
        }

        async function rejectUser(userId) {
            try {
                await db.collection('users').doc(userId).update({ approved: false });
                showToast('已撤销审核', 'info');
                renderAdminUsers();
            } catch (e) {
                showToast('操作失败', 'error');
            }
        }

        async function deleteUser(userId) {
            if (!confirm(`确定要删除用户 ${userId} 吗？`)) return;
            try {
                await db.collection('users').doc(userId).delete();
                showToast('已删除用户', 'info');
                renderAdminUsers();
            } catch (e) {
                showToast('删除失败', 'error');
            }
        }

        // ==================== 全局配置 ====================
        let globalSelectedModelId = null;

        async function renderGlobalConfig() {
            try {
                const docRef = db.collection('configs').doc('global');
                const doc = await docRef.get();
                let config = null;
                if (doc.exists) {
                    config = doc.data();
                } else {
                    config = { model: 'gpt-4o', apiKey: '', apiEndpoint: '' };
                    await docRef.set(config);
                }
                globalSelectedModelId = config.model || 'gpt-4o';
                renderModelGrid('globalModelGrid', globalSelectedModelId, (model) => {
                    globalSelectedModelId = model.id;
                    if (model.endpoint) document.getElementById('globalApiEndpoint').placeholder = `默认: ${model.endpoint}`;
                });
                document.getElementById('globalApiKey').value = config.apiKey || '';
                document.getElementById('globalApiEndpoint').value = config.apiEndpoint || '';
                const selectedModel = AI_MODELS.find(m => m.id === globalSelectedModelId);
                if (selectedModel?.endpoint) document.getElementById('globalApiEndpoint').placeholder = `默认: ${selectedModel.endpoint}`;
            } catch (e) {
                console.error('加载全局配置失败:', e);
            }
        }

        async function saveGlobalConfig() {
            if (!globalSelectedModelId) return showToast('请选择模型', 'error');
            const apiKey = document.getElementById('globalApiKey').value.trim();
            const apiEndpoint = document.getElementById('globalApiEndpoint').value.trim();
            try {
                await db.collection('configs').doc('global').set({
                    model: globalSelectedModelId,
                    apiKey,
                    apiEndpoint,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                showToast('全局配置已保存', 'success');
            } catch (e) {
                showToast('保存失败', 'error');
            }
        }

        // ==================== 用户面板 ====================
        let userSelectedModelId = null;

        async function renderUserPanel() {
            if (!currentUser) return;
            try {
                // 重新获取最新用户数据
                const userDoc = await db.collection('users').doc(currentUser.id).get();
                if (userDoc.exists) {
                    currentUser = { id: userDoc.id, ...userDoc.data() };
                }
                const userConfig = currentUser.config || {};
                const globalDoc = await db.collection('configs').doc('global').get();
                const globalConfig = globalDoc.exists ? globalDoc.data() : {};

                const effectiveModel = userConfig.model || globalConfig.model || 'gpt-4o';
                userSelectedModelId = userConfig.model || null;
                renderModelGrid('userModelGrid', userSelectedModelId || effectiveModel, (model) => {
                    userSelectedModelId = model.id;
                    if (model.endpoint) document.getElementById('userApiEndpoint').placeholder = `默认: ${model.endpoint}`;
                });
                document.getElementById('userApiKey').value = userConfig.apiKey || '';
                document.getElementById('userApiEndpoint').value = userConfig.apiEndpoint || '';
                const selectedModel = AI_MODELS.find(m => m.id === (userSelectedModelId || effectiveModel));
                if (selectedModel?.endpoint) document.getElementById('userApiEndpoint').placeholder = `默认: ${selectedModel.endpoint}`;

                // 显示账户信息
                const infoDiv = document.getElementById('accountInfo');
                infoDiv.innerHTML = `
                    <div><strong>用户名：</strong>${escHtml(currentUser.username)}</div>
                    <div><strong>角色：</strong>${currentUser.role === 'admin' ? '管理员' : '普通用户'}</div>
                    <div><strong>状态：</strong>${currentUser.approved ? '✅ 已审核' : '⏳ 待审核'}</div>
                    <div><strong>注册时间：</strong>${currentUser.createdAt ? new Date(currentUser.createdAt.seconds * 1000).toLocaleString() : '未知'}</div>
                    <div><strong>使用模型：</strong>${userSelectedModelId ? selectedModel?.name || userSelectedModelId : '使用全局配置（' + (AI_MODELS.find(m=>m.id===effectiveModel)?.name || effectiveModel) + '）'}</div>
                    <div><strong>API Key：</strong>${userConfig.apiKey ? '已设置（自定义）' : (globalConfig.apiKey ? '使用全局 Key' : '未设置')}</div>
                `;

                // 加载聊天记录
                await loadChatHistory();
            } catch (e) {
                console.error('加载用户面板失败:', e);
                showToast('加载数据失败', 'error');
            }
        }

        async function saveUserConfig() {
            if (!currentUser) return;
            const model = userSelectedModelId || null;
            const apiKey = document.getElementById('userApiKey').value.trim() || null;
            const apiEndpoint = document.getElementById('userApiEndpoint').value.trim() || null;
            try {
                await db.collection('users').doc(currentUser.id).update({
                    config: { model, apiKey, apiEndpoint }
                });
                showToast('配置已保存', 'success');
                currentUser.config = { model, apiKey, apiEndpoint };
                renderUserPanel(); // 刷新账户信息
            } catch (e) {
                showToast('保存失败', 'error');
            }
        }

        async function testApiKey() {
            const resultDiv = document.getElementById('testResult');
            resultDiv.style.display = 'block';
            resultDiv.style.padding = '16px';
            resultDiv.style.borderRadius = '8px';
            resultDiv.style.marginTop = '12px';
            resultDiv.textContent = '⏳ 正在测试连接...';
            resultDiv.className = 'text-muted';

            const userConfig = currentUser.config || {};
            const globalDoc = await db.collection('configs').doc('global').get();
            const globalConfig = globalDoc.exists ? globalDoc.data() : {};
            const modelId = userConfig.model || globalConfig.model || 'gpt-4o';
            const apiKey = userConfig.apiKey || globalConfig.apiKey || '';
            const apiEndpoint = userConfig.apiEndpoint || globalConfig.apiEndpoint || AI_MODELS.find(m => m.id === modelId)?.endpoint || '';
            const model = AI_MODELS.find(m => m.id === modelId);

            if (!apiKey) {
                resultDiv.textContent = '❌ 未设置 API Key';
                resultDiv.style.background = 'rgba(239,68,68,0.1)';
                resultDiv.style.color = '#fca5a5';
                return;
            }
            if (!apiEndpoint) {
                resultDiv.textContent = '❌ 未设置 API 端点';
                resultDiv.style.background = 'rgba(239,68,68,0.1)';
                resultDiv.style.color = '#fca5a5';
                return;
            }
            // 模拟验证
            await new Promise(resolve => setTimeout(resolve, 800));
            const isValid = apiKey.length >= 8;
            if (isValid) {
                resultDiv.textContent = `✅ API Key 格式验证通过\n\n模型: ${model?.name || modelId}\n端点: ${apiEndpoint}\nKey: ${apiKey.substring(0,4)}${'*'.repeat(Math.max(0, apiKey.length - 8))}${apiKey.slice(-4)}\n\n（实际 API 调用需要后端代理，此处仅格式验证）`;
                resultDiv.style.background = 'rgba(16,185,129,0.1)';
                resultDiv.style.color = '#6ee7b7';
            } else {
                resultDiv.textContent = '❌ API Key 格式无效（长度不足8位）';
                resultDiv.style.background = 'rgba(239,68,68,0.1)';
                resultDiv.style.color = '#fca5a5';
            }
        }

        // ==================== 聊天功能 ====================
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message || !currentUser) return;

            // 显示用户消息
            addChatMessage('user', message);
            input.value = '';
            document.getElementById('sendBtn').disabled = true;

            try {
                // 保存用户消息到 Firestore
                await db.collection('chats').add({
                    userId: currentUser.id,
                    role: 'user',
                    content: message,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                // 模拟 AI 回复（实际应调用后端 API）
                setTimeout(async () => {
                    const aiResponse = `这是对「${message}」的模拟回复。\n\n（当前为前端演示，实际 AI 回复需要后端代理调用模型 API）`;
                    addChatMessage('ai', aiResponse);
                    // 保存 AI 回复
                    await db.collection('chats').add({
                        userId: currentUser.id,
                        role: 'ai',
                        content: aiResponse,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    document.getElementById('sendBtn').disabled = false;
                }, 1000);
            } catch (e) {
                console.error('发送消息失败:', e);
                showToast('消息发送失败', 'error');
                document.getElementById('sendBtn').disabled = false;
            }
        }

        function addChatMessage(role, content) {
            const chatDiv = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-message ${role}`;
            msgDiv.textContent = content;
            chatDiv.appendChild(msgDiv);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        async function loadChatHistory() {
            const chatDiv = document.getElementById('chatMessages');
            chatDiv.innerHTML = '<div class="chat-message system">加载历史消息...</div>';
            try {
                const snapshot = await db.collection('chats')
                    .where('userId', '==', currentUser.id)
                    .orderBy('timestamp', 'asc')
                    .limit(100)
                    .get();
                chatDiv.innerHTML = '<div class="chat-message system">👋 欢迎使用 AI 对话。消息将保存在云端，可跨设备访问。</div>';
                snapshot.forEach(doc => {
                    const msg = doc.data();
                    addChatMessage(msg.role, msg.content);
                });
            } catch (e) {
                console.error('加载聊天记录失败:', e);
                chatDiv.innerHTML = '<div class="chat-message system">加载聊天记录失败</div>';
            }
        }

        // ==================== 初始化 ====================
        async function init() {
            // 检查是否存在默认管理员，没有则创建
            try {
                const adminDoc = await db.collection('users').doc('admin').get();
                if (!adminDoc.exists) {
                    await db.collection('users').doc('admin').set({
                        username: 'admin',
                        password: 'admin123',
                        role: 'admin',
                        approved: true,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        config: null
                    });
                    console.log('已创建默认管理员: admin / admin123');
                }
                // 检查全局配置
                const configDoc = await db.collection('configs').doc('global').get();
                if (!configDoc.exists) {
                    await db.collection('configs').doc('global').set({
                        model: 'gpt-4o',
                        apiKey: '',
                        apiEndpoint: ''
                    });
                }
            } catch (e) {
                console.error('初始化失败:', e);
                showToast('初始化失败，请检查 Firebase 配置', 'error');
            }

            // 默认显示登录页
            document.getElementById('authApp').classList.remove('hidden');
            document.getElementById('mainApp').classList.add('hidden');
        }

        // 启动
        init();
    </script>
</body>
</html>
