<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 模型管理平台</title>
    <style>
        :root {
            --bg: #0f1117;
            --card: #1a1d27;
            --card-hover: #222636;
            --border: #2d3142;
            --text: #e4e6ed;
            --text-secondary: #9ca3af;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            --transition: 0.2s ease;
            --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(ellipse at 20% 50%, #1a1d2e 0%, #0f1117 70%);
        }
        .app-container { width: 100%; max-width: 1200px; min-height: 80vh; display: flex; flex-direction: column; gap: 20px; }
        .app-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 24px; background: var(--card); border-radius: var(--radius);
            border: 1px solid var(--border); box-shadow: var(--shadow);
        }
        .app-header .logo { font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .app-header .logo .icon { width: 36px; height: 36px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .app-header .user-info { display: flex; align-items: center; gap: 14px; font-size: 0.9rem; color: var(--text-secondary); }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
        .badge-admin { background: rgba(99,102,241,0.2); color: var(--accent-hover); border: 1px solid rgba(99,102,241,0.4); }
        .badge-user { background: rgba(16,185,129,0.15); color: var(--success); border: 1px solid rgba(16,185,129,0.35); }
        .btn {
            padding: 10px 20px; border-radius: var(--radius-sm); border: none; cursor: pointer;
            font-size: 0.9rem; font-weight: 600; font-family: var(--font); transition: var(--transition);
            letter-spacing: 0.3px; display: inline-flex; align-items: center; gap: 8px; user-select: none;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 4px 16px rgba(99,102,241,0.4); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-outline { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-outline:hover { background: var(--card-hover); color: var(--text); }
        .btn-sm { padding: 6px 14px; font-size: 0.8rem; border-radius: 6px; }
        .card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 24px; transition: var(--transition); }
        .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 16px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: #11141d; color: var(--text);
            font-size: 0.95rem; font-family: var(--font); transition: var(--transition); outline: none;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }
        .auth-container { max-width: 420px; margin: 0 auto; width: 100%; }
        .auth-tabs { display: flex; gap: 0; margin-bottom: 20px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); }
        .auth-tabs button { flex: 1; padding: 12px; background: transparent; border: none; color: var(--text-secondary); font-size: 0.9rem; font-weight: 600; cursor: pointer; font-family: var(--font); transition: var(--transition); }
        .auth-tabs button.active { background: var(--accent); color: #fff; }
        .auth-tabs button:not(.active):hover { background: var(--card-hover); }
        .auth-message { padding: 12px 16px; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 14px; display: none; font-weight: 500; }
        .auth-message.error { display: block; background: rgba(239,68,68,0.12); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
        .auth-message.success { display: block; background: rgba(16,185,129,0.12); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
        .model-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .model-card { padding: 16px; border-radius: var(--radius-sm); border: 2px solid var(--border); background: #11141d; cursor: pointer; transition: var(--transition); text-align: center; position: relative; user-select: none; }
        .model-card:hover { border-color: #4a5068; background: #161a26; }
        .model-card.selected { border-color: var(--accent); background: rgba(99,102,241,0.1); box-shadow: 0 0 20px rgba(99,102,241,0.2); }
        .model-card .model-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
        .model-card .model-provider { font-size: 0.75rem; color: var(--text-secondary); }
        .model-card .check-mark { position: absolute; top: 8px; right: 10px; color: var(--accent); font-size: 1.1rem; display: none; }
        .model-card.selected .check-mark { display: block; }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-secondary); font-weight: 700; background: #11141d; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
        .status-dot.approved { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .status-dot.pending { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
        .password-cell { display: flex; align-items: center; gap: 6px; font-family: 'Courier New', monospace; }
        .password-cell .pw-text { filter: blur(4px); transition: var(--transition); cursor: pointer; user-select: all; }
        .password-cell .pw-text:hover, .password-cell .pw-text.revealed { filter: none; }
        .main-content { display: flex; flex-direction: column; gap: 20px; }
        .section-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .section-grid { grid-template-columns: 1fr; } .app-header { flex-direction: column; gap: 12px; text-align: center; } }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 28px; max-width: 500px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.5); animation: modalIn 0.25s ease; }
        @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .modal h3 { font-size: 1.2rem; margin-bottom: 16px; font-weight: 700; }
        .modal .close-btn { float: right; background: none; border: none; color: var(--text-secondary); font-size: 1.4rem; cursor: pointer; font-family: var(--font); line-height: 1; }
        .modal .close-btn:hover { color: var(--text); }
        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 14px 20px; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 600; animation: toastIn 0.3s ease; box-shadow: 0 8px 32px rgba(0,0,0,0.4); max-width: 360px; }
        .toast.success { background: var(--success); color: #fff; }
        .toast.error { background: var(--danger); color: #fff; }
        .toast.info { background: var(--accent); color: #fff; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        .toast.out { animation: toastOut 0.3s ease forwards; }
        @keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }
        .test-result { padding: 16px; border-radius: var(--radius-sm); margin-top: 12px; font-size: 0.85rem; line-height: 1.6; display: none; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; }
        .test-result.success { display: block; background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; }
        .test-result.error { display: block; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
        .test-result.info { display: block; background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.3); color: #a5b4fc; }
        .hidden { display: none !important; }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
        .empty-state .emoji { font-size: 3rem; margin-bottom: 12px; }
        .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
        .text-muted { color: var(--text-secondary); font-size: 0.8rem; }
        .mt-12 { margin-top: 12px; }
        .mb-12 { margin-bottom: 12px; }
        .flex-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h3 id="modalTitle">确认操作</h3>
            <div id="modalBody"><p>确定要执行此操作吗？</p></div>
            <div class="flex-between mt-12">
                <button class="btn btn-outline" onclick="closeModal()">取消</button>
                <button class="btn btn-danger" id="modalConfirmBtn" onclick="confirmModalAction()">确认</button>
            </div>
        </div>
    </div>

    <div id="authApp" class="auth-container hidden">
        <div class="card" style="padding: 32px;">
            <div style="text-align:center; margin-bottom:24px;">
                <div style="font-size:2.5rem; margin-bottom:8px;">🤖</div>
                <h2 style="font-weight:800; letter-spacing:-1px; font-size:1.6rem;">AI 模型管理平台</h2>
                <p class="text-muted mt-12">登录或注册以继续</p>
            </div>
            <div class="auth-tabs">
                <button id="tabLogin" class="active" onclick="switchAuthTab('login')">登录</button>
                <button id="tabRegister" onclick="switchAuthTab('register')">注册</button>
            </div>
            <div id="authMessage" class="auth-message"></div>
            <div id="loginForm">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="loginUsername" placeholder="请输入用户名" autocomplete="username">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
                </div>
                <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="handleLogin()">登 录</button>
            </div>
            <div id="registerForm" class="hidden">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="regUsername" placeholder="设置用户名" autocomplete="username">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="regPassword" placeholder="设置密码" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="regConfirmPassword" placeholder="再次输入密码" autocomplete="new-password">
                </div>
                <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="handleRegister()">注 册</button>
                <p class="text-muted mt-12" style="text-align:center;">注册后需等待管理员审核通过</p>
            </div>
        </div>
    </div>

    <div id="mainApp" class="app-container hidden">
        <div class="app-header">
            <div class="logo">
                <span class="icon">🤖</span>
                <span>AI 模型管理平台</span>
            </div>
            <div class="user-info" id="headerUserInfo">
                <span id="headerUsername"></span>
                <span id="headerBadge"></span>
                <button class="btn btn-outline btn-sm" onclick="handleLogout()">退出</button>
            </div>
        </div>

        <div id="adminPanel" class="main-content hidden">
            <div class="card">
                <div class="card-title"><span>👥</span> 用户管理</div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr><th>用户名</th><th>密码</th><th>角色</th><th>状态</th><th>操作</th></tr>
                        </thead>
                        <tbody id="userTableBody"></tbody>
                    </table>
                </div>
                <div id="emptyUsers" class="empty-state hidden">
                    <div class="emoji">📭</div><p>暂无用户数据</p>
                </div>
            </div>
            <div class="card">
                <div class="card-title"><span>⚙️</span> 全局 AI 模型配置</div>
                <p class="text-muted mb-12">设置所有用户的默认 AI 模型和 API Key（用户可独立覆盖）</p>
                <div class="model-grid" id="globalModelGrid"></div>
                <div class="form-group">
                    <label>API Key</label>
                    <input type="text" id="globalApiKey" placeholder="输入全局默认 API Key">
                </div>
                <div class="form-group">
                    <label>API 端点</label>
                    <input type="text" id="globalApiEndpoint" placeholder="API 端点（留空使用模型默认）">
                </div>
                <button class="btn btn-primary" onclick="saveGlobalConfig()">保存全局配置</button>
            </div>
        </div>

        <div id="userPanel" class="main-content hidden">
            <div class="card">
                <div class="card-title"><span>🔑</span> 我的 AI 模型配置</div>
                <p class="text-muted mb-12">选择你的 AI 模型并设置 API Key（留空则使用管理员全局配置）</p>
                <div class="model-grid" id="userModelGrid"></div>
                <div class="form-group">
                    <label>API Key</label>
                    <input type="text" id="userApiKey" placeholder="输入你的 API Key（留空使用全局配置）">
                </div>
                <div class="form-group">
                    <label>API 端点（可选）</label>
                    <input type="text" id="userApiEndpoint" placeholder="自定义 API 端点（留空使用模型默认）">
                </div>
                <div class="flex-between">
                    <button class="btn btn-primary" onclick="saveUserConfig()">保存我的配置</button>
                    <button class="btn btn-success" onclick="testApiKey()">测试连接</button>
                </div>
                <div id="testResult" class="test-result"></div>
            </div>
            <div class="card">
                <div class="card-title"><span>📋</span> 账户信息</div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;" id="accountInfo"></div>
            </div>
        </div>
    </div>

    <script>
        // ========== Data Store (LocalStorage-based with fallback) ==========
        const STORAGE_KEYS = {
            users: 'ai_platform_users',
            globalConfig: 'ai_platform_global_config',
            currentUser: 'ai_platform_current_user',
        };

        // 内存备用存储（当 localStorage 不可用时）
        let memoryStorage = {};

        function getStorage() {
            try {
                localStorage.setItem('__test__', '1');
                localStorage.removeItem('__test__');
                return localStorage;
            } catch (e) {
                console.warn('localStorage 不可用，使用内存存储（刷新后数据丢失）');
                return {
                    getItem: (key) => memoryStorage[key] || null,
                    setItem: (key, value) => { memoryStorage[key] = String(value); },
                    removeItem: (key) => { delete memoryStorage[key]; },
                };
            }
        }

        const storage = getStorage();

        const AI_MODELS = [
            { id: 'gpt-4o', name: 'GPT-4o', provider: 'OpenAI', endpoint: 'https://api.openai.com/v1/chat/completions' },
            { id: 'gpt-4o-mini', name: 'GPT-4o Mini', provider: 'OpenAI', endpoint: 'https://api.openai.com/v1/chat/completions' },
            { id: 'gpt-3.5-turbo', name: 'GPT-3.5 Turbo', provider: 'OpenAI', endpoint: 'https://api.openai.com/v1/chat/completions' },
            { id: 'claude-3-5-sonnet', name: 'Claude 3.5 Sonnet', provider: 'Anthropic', endpoint: 'https://api.anthropic.com/v1/messages' },
            { id: 'claude-3-opus', name: 'Claude 3 Opus', provider: 'Anthropic', endpoint: 'https://api.anthropic.com/v1/messages' },
            { id: 'gemini-pro', name: 'Gemini Pro', provider: 'Google', endpoint: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent' },
            { id: 'deepseek-chat', name: 'DeepSeek Chat', provider: 'DeepSeek', endpoint: 'https://api.deepseek.com/v1/chat/completions' },
            { id: 'qwen-turbo', name: '通义千问 Turbo', provider: 'Alibaba', endpoint: 'https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation' },
            { id: 'custom', name: '自定义模型', provider: 'Custom', endpoint: '' },
        ];

        // ========== Helpers ==========
        function getUsers() {
            try { return JSON.parse(storage.getItem(STORAGE_KEYS.users)) || []; } catch (e) { return []; }
        }
        function saveUsers(users) {
            try { storage.setItem(STORAGE_KEYS.users, JSON.stringify(users)); } catch (e) { console.warn('保存用户数据失败', e); }
        }
        function getGlobalConfig() {
            try { return JSON.parse(storage.getItem(STORAGE_KEYS.globalConfig)) || null; } catch (e) { return null; }
        }
        function saveGlobalConfig(config) {
            try { storage.setItem(STORAGE_KEYS.globalConfig, JSON.stringify(config)); } catch (e) { console.warn('保存全局配置失败', e); }
        }
        function getCurrentUser() {
            try { return JSON.parse(storage.getItem(STORAGE_KEYS.currentUser)); } catch (e) { return null; }
        }
        function setCurrentUser(user) {
            try { storage.setItem(STORAGE_KEYS.currentUser, JSON.stringify(user)); } catch (e) { console.warn('保存当前用户失败', e); }
        }
        function clearCurrentUser() {
            try { storage.removeItem(STORAGE_KEYS.currentUser); } catch (e) { console.warn('清除当前用户失败', e); }
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
        }
        function findUserByUsername(username) {
            return getUsers().find(u => u.username === username);
        }
        function findUserById(id) {
            return getUsers().find(u => u.id === id);
        }

        // ========== Toast ==========
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('out');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // ========== Modal ==========
        function showModal(title, body, confirmCallback) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = body;
            document.getElementById('modalOverlay').classList.add('active');
            window._modalConfirmCallback = confirmCallback;
        }
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            window._modalConfirmCallback = null;
        }
        function confirmModalAction() {
            if (window._modalConfirmCallback) window._modalConfirmCallback();
            closeModal();
        }

        // ========== Auth ==========
        function switchAuthTab(tab) {
            const loginTab = document.getElementById('tabLogin');
            const registerTab = document.getElementById('tabRegister');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const authMsg = document.getElementById('authMessage');
            authMsg.className = 'auth-message';
            authMsg.style.display = 'none';
            if (tab === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
            } else {
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                registerForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            }
        }
        function showAuthMessage(msg, type) {
            const el = document.getElementById('authMessage');
            el.className = `auth-message ${type}`;
            el.textContent = msg;
            el.style.display = 'block';
        }

        function handleRegister() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPw = document.getElementById('regConfirmPassword').value;
            if (!username || !password) return showAuthMessage('请填写用户名和密码', 'error');
            if (username.length < 3) return showAuthMessage('用户名至少3个字符', 'error');
            if (password.length < 4) return showAuthMessage('密码至少4个字符', 'error');
            if (password !== confirmPw) return showAuthMessage('两次密码不一致', 'error');
            const users = getUsers();
            if (users.find(u => u.username === username)) return showAuthMessage('用户名已存在', 'error');
            const newUser = {
                id: generateId(),
                username,
                password,
                role: 'user',
                approved: false,
                createdAt: new Date().toISOString(),
                config: null,
            };
            users.push(newUser);
            saveUsers(users);
            showAuthMessage('注册成功！请等待管理员审核通过后登录。', 'success');
            document.getElementById('regUsername').value = '';
            document.getElementById('regPassword').value = '';
            document.getElementById('regConfirmPassword').value = '';
            setTimeout(() => switchAuthTab('login'), 1500);
        }

        function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            if (!username || !password) return showAuthMessage('请填写用户名和密码', 'error');
            const user = findUserByUsername(username);
            if (!user) return showAuthMessage('用户不存在', 'error');
            if (user.password !== password) return showAuthMessage('密码错误', 'error');
            if (!user.approved && user.role !== 'admin') return showAuthMessage('账户尚未通过审核，请联系管理员', 'error');
            setCurrentUser(user);
            showToast(`欢迎回来，${user.username}！`, 'success');
            enterMainApp();
        }

        function handleLogout() {
            clearCurrentUser();
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('authApp').classList.remove('hidden');
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
            showToast('已退出登录', 'info');
        }

        // ========== Main App ==========
        function enterMainApp() {
            const user = getCurrentUser();
            if (!user) return;
            document.getElementById('authApp').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('headerUsername').textContent = user.username;
            const badge = document.getElementById('headerBadge');
            if (user.role === 'admin') {
                badge.className = 'badge badge-admin';
                badge.textContent = '管理员';
            } else {
                badge.className = 'badge badge-user';
                badge.textContent = '已审核';
            }
            if (user.role === 'admin') {
                document.getElementById('adminPanel').classList.remove('hidden');
                document.getElementById('userPanel').classList.add('hidden');
                renderAdminUsers();
                renderGlobalConfig();
            } else {
                document.getElementById('userPanel').classList.remove('hidden');
                document.getElementById('adminPanel').classList.add('hidden');
                renderUserPanel();
            }
        }

        // ========== Admin ==========
        function renderAdminUsers() {
            const users = getUsers();
            const tbody = document.getElementById('userTableBody');
            const empty = document.getElementById('emptyUsers');
            tbody.innerHTML = '';
            const nonAdminUsers = users.filter(u => u.role !== 'admin');
            if (nonAdminUsers.length === 0) {
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');
            nonAdminUsers.forEach(u => {
                const tr = document.createElement('tr');
                const statusDot = u.approved ? 'approved' : 'pending';
                const statusText = u.approved ? '已审核' : '待审核';
                tr.innerHTML = `
                    <td><strong>${escHtml(u.username)}</strong></td>
                    <td>
                        <span class="password-cell">
                            <span class="pw-text" onclick="togglePw(this)">${escHtml(u.password)}</span>
                            <button class="btn btn-outline btn-sm" onclick="togglePw(this.parentElement.querySelector('.pw-text'))">👁</button>
                        </span>
                    </td>
                    <td>${u.role === 'admin' ? '管理员' : '用户'}</td>
                    <td><span class="status-dot ${statusDot}"></span>${statusText}</td>
                    <td>
                        ${!u.approved ? 
                            `<button class="btn btn-success btn-sm" onclick="approveUser('${u.id}')">✓ 通过</button> ` : 
                            `<button class="btn btn-danger btn-sm" onclick="rejectUser('${u.id}')">✗ 撤销</button>`}
                        <button class="btn btn-outline btn-sm" onclick="deleteUser('${u.id}')">删除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
        function escHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        function togglePw(el) {
            el.classList.toggle('revealed');
        }
        function approveUser(userId) {
            const users = getUsers();
            const user = users.find(u => u.id === userId);
            if (user) {
                user.approved = true;
                saveUsers(users);
                renderAdminUsers();
                showToast(`已通过 ${user.username} 的审核`, 'success');
            }
        }
        function rejectUser(userId) {
            const users = getUsers();
            const user = users.find(u => u.id === userId);
            if (user) {
                user.approved = false;
                saveUsers(users);
                renderAdminUsers();
                showToast(`已撤销 ${user.username} 的审核状态`, 'info');
            }
        }
        function deleteUser(userId) {
            const users = getUsers();
            const user = users.find(u => u.id === userId);
            if (!user) return;
            showModal('删除用户', `<p>确定要删除用户 <strong>${escHtml(user.username)}</strong> 吗？此操作不可撤销。</p>`, () => {
                const updated = users.filter(u => u.id !== userId);
                saveUsers(updated);
                renderAdminUsers();
                showToast(`已删除用户 ${user.username}`, 'info');
            });
        }

        // ========== Model Grid ==========
        function renderModelGrid(containerId, selectedModelId, onSelect) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            AI_MODELS.forEach(model => {
                const card = document.createElement('div');
                card.className = `model-card ${model.id === selectedModelId ? 'selected' : ''}`;
                card.innerHTML = `
                    <span class="check-mark">✓</span>
                    <div class="model-name">${model.name}</div>
                    <div class="model-provider">${model.provider}</div>
                `;
                card.addEventListener('click', () => {
                    container.querySelectorAll('.model-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    onSelect(model);
                });
                container.appendChild(card);
            });
        }

        // ========== Global Config ==========
        let globalSelectedModelId = null;
        function renderGlobalConfig() {
            const config = getGlobalConfig();
            const selectedId = config?.model || 'gpt-4o';
            globalSelectedModelId = selectedId;
            renderModelGrid('globalModelGrid', selectedId, (model) => {
                globalSelectedModelId = model.id;
                if (model.endpoint) document.getElementById('globalApiEndpoint').placeholder = `默认: ${model.endpoint}`;
            });
            document.getElementById('globalApiKey').value = config?.apiKey || '';
            document.getElementById('globalApiEndpoint').value = config?.apiEndpoint || '';
            const selectedModel = AI_MODELS.find(m => m.id === selectedId);
            if (selectedModel?.endpoint) document.getElementById('globalApiEndpoint').placeholder = `默认: ${selectedModel.endpoint}`;
        }
        function saveGlobalConfig() {
            const modelId = globalSelectedModelId || 'gpt-4o';
            const apiKey = document.getElementById('globalApiKey').value.trim();
            const apiEndpoint = document.getElementById('globalApiEndpoint').value.trim();
            const config = { model: modelId, apiKey, apiEndpoint, updatedAt: new Date().toISOString() };
            saveGlobalConfig(config);
            showToast('全局配置已保存', 'success');
        }

        // ========== User Panel ==========
        let userSelectedModelId = null;
        function renderUserPanel() {
            const user = getCurrentUser();
            if (!user) return;
            const freshUser = findUserById(user.id) || user;
            setCurrentUser(freshUser);
            const userConfig = freshUser.config || {};
            const globalConfig = getGlobalConfig() || {};
            const effectiveModel = userConfig.model || globalConfig.model || 'gpt-4o';
            const effectiveApiKey = userConfig.apiKey || globalConfig.apiKey || '';
            const effectiveEndpoint = userConfig.apiEndpoint || globalConfig.apiEndpoint || '';
            userSelectedModelId = userConfig.model || null;
            renderModelGrid('userModelGrid', userSelectedModelId || effectiveModel, (model) => {
                userSelectedModelId = model.id;
                if (model.endpoint) document.getElementById('userApiEndpoint').placeholder = `默认: ${model.endpoint}`;
            });
            document.getElementById('userApiKey').value = userConfig.apiKey || '';
            document.getElementById('userApiEndpoint').value = userConfig.apiEndpoint || '';
            const selectedModel = AI_MODELS.find(m => m.id === (userSelectedModelId || effectiveModel));
            if (selectedModel?.endpoint) document.getElementById('userApiEndpoint').placeholder = `默认: ${selectedModel.endpoint}`;
            const infoDiv = document.getElementById('accountInfo');
            infoDiv.innerHTML = `
                <div><strong>用户名：</strong>${escHtml(freshUser.username)}</div>
                <div><strong>角色：</strong>${freshUser.role === 'admin' ? '管理员' : '普通用户'}</div>
                <div><strong>状态：</strong>${freshUser.approved ? '✅ 已审核' : '⏳ 待审核'}</div>
                <div><strong>注册时间：</strong>${new Date(freshUser.createdAt).toLocaleString()}</div>
                <div><strong>使用模型：</strong>${userSelectedModelId ? selectedModel?.name || userSelectedModelId : '使用全局配置（' + (AI_MODELS.find(m=>m.id===effectiveModel)?.name || effectiveModel) + '）'}</div>
                <div><strong>API Key：</strong>${userConfig.apiKey ? '已设置（自定义）' : (globalConfig.apiKey ? '使用全局 Key' : '未设置')}</div>
            `;
        }
        function saveUserConfig() {
            const user = getCurrentUser();
            if (!user) return;
            const users = getUsers();
            const idx = users.findIndex(u => u.id === user.id);
            if (idx === -1) return;
            const model = userSelectedModelId || null;
            const apiKey = document.getElementById('userApiKey').value.trim() || null;
            const apiEndpoint = document.getElementById('userApiEndpoint').value.trim() || null;
            users[idx].config = { model, apiKey, apiEndpoint };
            saveUsers(users);
            setCurrentUser(users[idx]);
            renderUserPanel();
            showToast('你的配置已保存', 'success');
        }
        async function testApiKey() {
            const resultDiv = document.getElementById('testResult');
            resultDiv.className = 'test-result info';
            resultDiv.textContent = '⏳ 正在测试连接...';
            resultDiv.style.display = 'block';
            const user = getCurrentUser();
            const freshUser = findUserById(user.id) || user;
            const userConfig = freshUser.config || {};
            const globalConfig = getGlobalConfig() || {};
            const modelId = userConfig.model || globalConfig.model || 'gpt-4o';
            const apiKey = userConfig.apiKey || globalConfig.apiKey || '';
            const apiEndpoint = userConfig.apiEndpoint || globalConfig.apiEndpoint || AI_MODELS.find(m => m.id === modelId)?.endpoint || '';
            const model = AI_MODELS.find(m => m.id === modelId);
            if (!apiKey) {
                resultDiv.className = 'test-result error';
                resultDiv.textContent = '❌ 未设置 API Key，请先保存配置。';
                return;
            }
            if (!apiEndpoint) {
                resultDiv.className = 'test-result error';
                resultDiv.textContent = '❌ 未设置 API 端点，请选择模型或手动输入端点。';
                return;
            }
            try {
                const mockSuccess = apiKey.length >= 8;
                await new Promise(resolve => setTimeout(resolve, 800));
                if (mockSuccess) {
                    resultDiv.className = 'test-result success';
                    resultDiv.textContent = `✅ API Key 格式验证通过！\n\n模型: ${model?.name || modelId}\n端点: ${apiEndpoint}\nKey: ${apiKey.substring(0, 4)}${'*'.repeat(Math.max(0, apiKey.length - 8))}${apiKey.slice(-4)}\n\n（实际 API 调用需要后端代理以避免 CORS，此处为格式验证）`;
                } else {
                    resultDiv.className = 'test-result error';
                    resultDiv.textContent = '❌ API Key 格式无效（长度不足8位），请检查后重试。';
                }
            } catch (err) {
                resultDiv.className = 'test-result error';
                resultDiv.textContent = '❌ 测试失败: ' + err.message;
            }
        }

        // ========== Init ==========
        function initDefaultAdmin() {
            let users = getUsers();
            if (!users.find(u => u.role === 'admin')) {
                users.push({
                    id: generateId(),
                    username: 'admin',
                    password: 'admin123',
                    role: 'admin',
                    approved: true,
                    createdAt: new Date().toISOString(),
                    config: null,
                });
                saveUsers(users);
                console.log('已创建默认管理员: admin / admin123');
            }
            if (!getGlobalConfig()) {
                saveGlobalConfig({ model: 'gpt-4o', apiKey: '', apiEndpoint: '', updatedAt: new Date().toISOString() });
            }
        }

        function init() {
            // 确保界面至少显示登录页，避免黑屏
            try {
                initDefaultAdmin();
            } catch (e) {
                console.error('初始化默认数据失败:', e);
            }
            const currentUser = getCurrentUser();
            if (currentUser) {
                const freshUser = findUserById(currentUser.id);
                if (freshUser) {
                    setCurrentUser(freshUser);
                    enterMainApp();
                    return;
                }
            }
            // 显示登录界面
            document.getElementById('authApp').classList.remove('hidden');
            document.getElementById('mainApp').classList.add('hidden');
        }

        // 事件绑定
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const authApp = document.getElementById('authApp');
                if (!authApp.classList.contains('hidden')) {
                    if (!document.getElementById('loginForm').classList.contains('hidden')) handleLogin();
                    else if (!document.getElementById('registerForm').classList.contains('hidden')) handleRegister();
                }
            }
        });
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        // 启动
        init();
    </script>
</body>
</html>
