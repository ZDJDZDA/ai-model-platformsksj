<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI 人格测试</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --primary: #6c5ce7;
            --primary-hover: #5a4bd1;
            --text: #2d3748;
            --text-secondary: #4a5568;
            --border: #e2e8f0;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --radius: 16px;
            --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 40px;
            margin: 20px auto;
        }
        h1 {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--primary);
        }
        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 1rem;
        }
        .question {
            margin-bottom: 24px;
            padding: 20px;
            background: #f9fafc;
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }
        .question:hover {
            border-color: #cbd5e0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .question-text {
            font-weight: 600;
            margin-bottom: 14px;
            font-size: 1.05rem;
        }
        .options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .option-btn {
            flex: 1;
            min-width: 120px;
            padding: 10px 16px;
            border-radius: 10px;
            border: 2px solid var(--border);
            background: white;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            text-align: center;
            transition: all 0.2s;
            color: var(--text);
            font-family: var(--font);
            user-select: none;
        }
        .option-btn:hover {
            border-color: var(--primary);
            background: #f3f0ff;
        }
        .option-btn.selected {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
            font-weight: 600;
        }
        .submit-btn {
            display: block;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 30px;
            transition: background 0.2s;
            font-family: var(--font);
            letter-spacing: 1px;
        }
        .submit-btn:hover {
            background: var(--primary-hover);
        }
        .submit-btn:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }
        /* 结果页面 */
        .result-container {
            text-align: center;
        }
        .result-type {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 8px;
            color: var(--primary);
            margin-bottom: 10px;
        }
        .result-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .dimension-scores {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
            text-align: left;
        }
        .dimension {
            background: #f9fafc;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border);
        }
        .dimension-name {
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .score-bar {
            height: 8px;
            background: #edf2f7;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        .score-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 4px;
            transition: width 1s ease;
        }
        .description {
            background: #f3f0ff;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
            font-size: 0.95rem;
            border-left: 4px solid var(--primary);
        }
        .retake-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            border-radius: 10px;
            background: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            font-weight: 700;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
            font-family: var(--font);
        }
        .retake-btn:hover {
            background: var(--primary);
            color: white;
        }
        .hidden { display: none !important; }
        @media (max-width: 600px) {
            .container { padding: 20px; }
            h1 { font-size: 1.8rem; }
            .dimension-scores { grid-template-columns: 1fr; }
            .result-type { font-size: 3rem; letter-spacing: 4px; }
            .option-btn { min-width: 100px; padding: 8px 12px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="container" id="testContainer">
        <h1>🧠 MBTI 人格测试</h1>
        <p class="subtitle">选择最符合你的选项，共 28 题，大约需要 5 分钟</p>
        <div id="questionsContainer"></div>
        <button class="submit-btn" id="submitBtn" onclick="calculateResult()" disabled>提交测试</button>
    </div>

    <div class="container result-container hidden" id="resultContainer">
        <h1>🎉 测试结果</h1>
        <div class="result-type" id="resultType"></div>
        <div class="result-title" id="resultTitle"></div>
        <div class="dimension-scores" id="dimensionScores"></div>
        <div class="description" id="resultDescription"></div>
        <button class="retake-btn" onclick="retakeTest()">重新测试</button>
    </div>

    <script>
        // ==================== 题库数据 ====================
        // 每个题目包含：问题文本、两个选项（分别对应维度的两端）、维度标识
        const questions = [
            // E / I 维度 (7题)
            { text: "在聚会中，你通常", options: ["主动结识新朋友，精力充沛", "更愿意和熟悉的人待在一起"], dimension: "EI" },
            { text: "独处一段时间后，你通常会", options: ["感到无聊，想找人聊天", "享受安静，感到放松"], dimension: "EI" },
            { text: "你更喜欢的工作环境是", options: ["开放、热闹、充满互动", "安静、独立、专注思考"], dimension: "EI" },
            { text: "当你需要解决问题时，你倾向于", options: ["和别人讨论，碰撞想法", "自己先想清楚再行动"], dimension: "EI" },
            { text: "在社交场合，你通常", options: ["说话较多，容易兴奋", "倾听较多，观察为主"], dimension: "EI" },
            { text: "你更喜欢的休闲方式是", options: ["和朋友外出活动", "在家看书或看电影"], dimension: "EI" },
            { text: "认识新朋友对你来说", options: ["是件令人兴奋的事", "需要一些时间适应"], dimension: "EI" },

            // S / N 维度 (7题)
            { text: "你更关注", options: ["具体的细节和事实", "抽象的概念和可能性"], dimension: "SN" },
            { text: "学习新事物时，你更喜欢", options: ["按步骤实际操作", "先理解整体框架"], dimension: "SN" },
            { text: "你更相信", options: ["亲身经历和实际数据", "直觉和灵感"], dimension: "SN" },
            { text: "描述一件事时，你通常", options: ["注重时间、地点、过程", "注重意义、联想和未来"], dimension: "SN" },
            { text: "你更喜欢的任务是", options: ["有明确步骤和标准", "需要创意和想象"], dimension: "SN" },
            { text: "阅读时，你更注重", options: ["文字本身的内容", "文字背后的深层含义"], dimension: "SN" },
            { text: "你更擅长", options: ["处理实际事务", "构思长远规划"], dimension: "SN" },

            // T / F 维度 (7题)
            { text: "做决定时，你更看重", options: ["逻辑和公平", "感受和人际关系"], dimension: "TF" },
            { text: "当朋友遇到困难，你首先", options: ["提供解决方案", "给予情感安慰"], dimension: "TF" },
            { text: "你认为自己更", options: ["理性、客观", "感性、有同情心"], dimension: "TF" },
            { text: "在争论中，你更倾向于", options: ["坚持事实和道理", "维护和谐气氛"], dimension: "TF" },
            { text: "别人通常认为你", options: ["冷静、善于分析", "温暖、善解人意"], dimension: "TF" },
            { text: "批评别人时，你更", options: ["直接指出问题", "委婉地表达"], dimension: "TF" },
            { text: "你更重视", options: ["原则和一致性", "情感和价值观"], dimension: "TF" },

            // J / P 维度 (7题)
            { text: "你更喜欢", options: ["按计划行事，提前安排", "灵活应变，随机调整"], dimension: "JP" },
            { text: "你的工作台通常", options: ["整洁有序", "有些杂乱但有创意"], dimension: "JP" },
            { text: "面对截止日期，你通常", options: ["提前完成，从容不迫", "最后一刻冲刺"], dimension: "JP" },
            { text: "你更享受", options: ["确定性和稳定性", "新鲜感和变化"], dimension: "JP" },
            { text: "旅行时，你倾向于", options: ["详细规划行程", "说走就走，随遇而安"], dimension: "JP" },
            { text: "你更喜欢的生活是", options: ["井井有条，按部就班", "自由自在，不受约束"], dimension: "JP" },
            { text: "做决定后，你通常", options: ["感到安心，尽快行动", "还想保留其他可能性"], dimension: "JP" },
        ];

        // 存储用户答案（索引对应题目，值为 'a' 或 'b'）
        let answers = new Array(questions.length).fill(null);

        // MBTI 类型描述数据
        const typeDescriptions = {
            "ISTJ": "严肃、安静，通过全神贯注和细致周到而赢得成功。实际、有序、关注事实、有逻辑、现实、可信赖。",
            "ISFJ": "安静、友好、负责、有良心。工作投入，力图满足职责要求。体贴、关心他人的感受。",
            "INFJ": "寻找思想、关系、物质等之间的意义和联系。希望了解什么能够激励人，对他人有很强的洞察力。有责任心，坚持自己的价值观。",
            "INTJ": "有原创思想，并具有强大的动力去实现自己的想法和目标。能很快洞察外界事物间的规律并形成长期的远景计划。",
            "ISTP": "冷静的旁观者，安静、寡言，以超然的好奇心观察和分析生活。通常对客观规律、机械事物的原理感兴趣。",
            "ISFP": "安静、友好、敏感、和善。享受当前。喜欢有自己的空间，按照自己的时间表工作。对自己的价值观和重要的人非常忠诚。",
            "INFP": "理想主义者，忠于自己的价值观和重要的人。希望外部生活与内心价值观相统一。好奇心重，很快看到各种可能性。",
            "INTP": "安静、善于思考、具有怀疑精神。特别喜欢理论和科学探究。喜欢运用逻辑分析解决问题。",
            "ESTP": "灵活、忍耐力强、实际、注重结果。认为理论和抽象的解释无趣。喜欢积极地采取行动解决问题。",
            "ESFP": "外向、友好、接受力强。热爱生活、人类和物质享受。喜欢与他人一起将事情做成功。",
            "ENFP": "热情洋溢、富有想象力。认为人生充满可能性。能很快地将事情和信息联系起来，然后很自信地根据自己的判断解决问题。",
            "ENTP": "反应快、睿智、有激励别人的能力，警觉性强、直言不讳。在解决新的、具有挑战性的问题时，富有策略。",
            "ESTJ": "实际、现实主义。果断，一旦下决心就会马上行动。善于将项目和人组织起来将事情完成。",
            "ESFJ": "热心、有责任心、合作。希望周边的环境温馨而和谐，并为此果断地行动。喜欢和他人一起精确并及时地完成任务。",
            "ENFJ": "敏感、热情、为他人着想。善于发现他人的潜能，并愿意帮助他们成长。能成为个人或群体成长和进步的催化剂。",
            "ENTJ": "坦诚、果断，有天生的领导能力。能很快看到公司/组织程序和政策中的不合理性和低效能性，并发展出全面有效的系统来解决问题。"
        };

        // 渲染题目
        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            questions.forEach((q, index) => {
                const qDiv = document.createElement('div');
                qDiv.className = 'question';
                qDiv.innerHTML = `
                    <div class="question-text">${index + 1}. ${q.text}</div>
                    <div class="options">
                        <button class="option-btn" data-qindex="${index}" data-opt="a" onclick="selectOption(${index}, 'a')">${q.options[0]}</button>
                        <button class="option-btn" data-qindex="${index}" data-opt="b" onclick="selectOption(${index}, 'b')">${q.options[1]}</button>
                    </div>
                `;
                container.appendChild(qDiv);
            });
            updateSubmitButton();
        }

        // 选择选项
        function selectOption(qIndex, opt) {
            answers[qIndex] = opt;
            // 更新按钮样式
            const qDiv = document.querySelectorAll('.question')[qIndex];
            qDiv.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            qDiv.querySelector(`.option-btn[data-opt="${opt}"]`).classList.add('selected');
            updateSubmitButton();
        }

        // 更新提交按钮状态
        function updateSubmitButton() {
            const allAnswered = answers.every(ans => ans !== null);
            document.getElementById('submitBtn').disabled = !allAnswered;
        }

        // 计算结果
        function calculateResult() {
            // 初始化各维度得分
            let scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
            
            // 计算得分
            questions.forEach((q, index) => {
                const answer = answers[index];
                if (!answer) return;
                const selectedText = q.options[answer === 'a' ? 0 : 1];
                // 根据题目维度和选项确定得分
                if (q.dimension === 'EI') {
                    if (answer === 'a') scores.E++; else scores.I++;
                } else if (q.dimension === 'SN') {
                    if (answer === 'a') scores.S++; else scores.N++;
                } else if (q.dimension === 'TF') {
                    if (answer === 'a') scores.T++; else scores.F++;
                } else if (q.dimension === 'JP') {
                    if (answer === 'a') scores.J++; else scores.P++;
                }
            });

            // 确定四个字母
            const type = [
                scores.E >= scores.I ? 'E' : 'I',
                scores.S >= scores.N ? 'S' : 'N',
                scores.T >= scores.F ? 'T' : 'F',
                scores.J >= scores.P ? 'J' : 'P'
            ].join('');

            // 显示结果
            document.getElementById('testContainer').classList.add('hidden');
            document.getElementById('resultContainer').classList.remove('hidden');
            document.getElementById('resultType').textContent = type;
            document.getElementById('resultTitle').textContent = getTypeTitle(type);
            document.getElementById('resultDescription').textContent = typeDescriptions[type] || '暂无描述';

            // 显示维度得分条
            const dimensionScores = document.getElementById('dimensionScores');
            dimensionScores.innerHTML = '';
            const dimensions = [
                { label: '外向 (E) vs 内向 (I)', left: 'E', right: 'I', leftScore: scores.E, rightScore: scores.I },
                { label: '感觉 (S) vs 直觉 (N)', left: 'S', right: 'N', leftScore: scores.S, rightScore: scores.N },
                { label: '思考 (T) vs 情感 (F)', left: 'T', right: 'F', leftScore: scores.T, rightScore: scores.F },
                { label: '判断 (J) vs 感知 (P)', left: 'J', right: 'P', leftScore: scores.J, rightScore: scores.P },
            ];

            dimensions.forEach(dim => {
                const total = dim.leftScore + dim.rightScore;
                const leftPercent = Math.round((dim.leftScore / total) * 100);
                const dimDiv = document.createElement('div');
                dimDiv.className = 'dimension';
                dimDiv.innerHTML = `
                    <div class="dimension-name">
                        <span>${dim.left} (${dim.leftScore})</span>
                        <span>${dim.right} (${dim.rightScore})</span>
                    </div>
                    <div class="score-bar">
                        <div class="score-fill" style="width: ${leftPercent}%"></div>
                    </div>
                `;
                dimensionScores.appendChild(dimDiv);
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 获取类型标题
        function getTypeTitle(type) {
            const titles = {
                "ISTJ": "物流师型 - 实际且稳重",
                "ISFJ": "守卫者型 - 专注且温暖",
                "INFJ": "提倡者型 - 安静而有远见",
                "INTJ": "建筑师型 - 富有想象力且果断",
                "ISTP": "鉴赏家型 - 大胆而实际",
                "ISFP": "探险家型 - 灵活且有魅力",
                "INFP": "调停者型 - 理想主义且忠诚",
                "INTP": "逻辑学家型 - 具有创造力的思考者",
                "ESTP": "企业家型 - 精力充沛且敏锐",
                "ESFP": "表演者型 - 自发且充满活力",
                "ENFP": "竞选者型 - 热情且有创造力",
                "ENTP": "辩论家型 - 聪明且好奇",
                "ESTJ": "总经理型 - 高效且有条理",
                "ESFJ": "执政官型 - 热心且负责",
                "ENFJ": "主人公型 - 富有魅力且鼓舞人心",
                "ENTJ": "指挥官型 - 大胆且果断"
            };
            return titles[type] || type;
        }

        // 重新测试
        function retakeTest() {
            answers = new Array(questions.length).fill(null);
            document.getElementById('resultContainer').classList.add('hidden');
            document.getElementById('testContainer').classList.remove('hidden');
            renderQuestions();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 初始化
        renderQuestions();
    </script>
</body>
</html>
